version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: opspulse-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: opspulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opspulse-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - SUPABASE_POSTGRES_URL=postgresql://postgres:password@postgres:5432/opspulse
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    image: node:18-alpine
    container_name: opspulse-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
